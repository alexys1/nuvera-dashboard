<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nuvera Bot — Bot 4</title>
<meta name="description" content="Dashboard en vivo de Bot 4, el bot de trading DCA de Nuvera que opera con dinero real en Binance">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#0a0a0f" stroke-width="1.6"></circle><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="800" fill="#0a0a0f" font-family="Georgia, serif">$</text></svg>
      </span>
      <div>
        <div class="brand-name">NUVERA BOT</div>
        <div class="brand-sub"><span class="live-dot"></span>Bot 4 · Dinero real</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" data-route="inicio">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"></path></svg></span>
        <span>Inicio</span>
      </button>
      <button class="nav-item" data-route="posiciones">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path><circle cx="17" cy="15" r="1.4"></circle></svg></span>
        <span>Posiciones</span>
      </button>
      <button class="nav-item" data-route="historial">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg></span>
        <span>Historial</span>
      </button>
      <button class="nav-item" data-route="metricas">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M12 20V4"></path><path d="M20 20v-7"></path></svg></span>
        <span>Métricas</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" data-route="settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="18" r="2"></circle></svg></span>
        <span>Settings</span>
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="content" id="content">
    <div class="empty-state">Cargando…</div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
