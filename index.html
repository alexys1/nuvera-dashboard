<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nuvera Bot — Institutional</title>
<meta name="description" content="Dashboard institucional en vivo del bot de trading Nuvera">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <div>
        <div class="brand-name">NUVERA BOT</div>
        <div class="brand-sub">Institutional</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" data-route="overview"><span class="nav-icon">📊</span><span>Overview</span></button>
      <button class="nav-item" data-route="metricas"><span class="nav-icon">📈</span><span>Métricas</span></button>
      <button class="nav-item" data-route="motorb"><span class="nav-icon">🔄</span><span>Motor B</span></button>
      <button class="nav-item" data-route="motora"><span class="nav-icon">💛</span><span>Motor A DCA</span></button>
      <button class="nav-item" data-route="bot2"><span class="nav-icon">📐</span><span>Bot 2 Grid</span></button>
      <button class="nav-item" data-route="bot3"><span class="nav-icon">📈</span><span>Bot 3 DCA</span></button>
      <button class="nav-item" data-route="bot4"><span class="nav-icon">💰</span><span>Bot 4 DCA</span></button>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" data-route="settings"><span class="nav-icon">⚙️</span><span>Settings</span></button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="content" id="content">
    <div class="empty-state">Cargando…</div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
