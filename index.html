<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nuvera Bot</title>
<meta name="description" content="Dashboard en vivo del bot de trading Nuvera">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --green: #00ff88;
    --red: #ff4444;
    --text: #e6edf3;
    --text-sec: #8b949e;
    --active-bg: #21262d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    max-width: 100vw;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--green); }

  /* ---------- Header fijo ---------- */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + var(--safe-top)) 16px 10px;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    margin-right: auto;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-sec); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.bad { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .header-main {
    display: flex;
    gap: 28px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .metric-value { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .metric-label { font-size: 11px; text-transform: uppercase; color: var(--text-sec); letter-spacing: 0.5px; margin-top: 2px; }
  .metric-pnl { font-size: 15px; font-weight: 600; }

  .header-sub {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: var(--text-sec);
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }

  /* ---------- Layout general ---------- */
  main { padding: 16px; padding-bottom: calc(24px + var(--safe-bottom)); max-width: 900px; margin: 0 auto; }
  section { margin-bottom: 20px; }

  /* ---------- Gráfica ---------- */
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .period-selector { display: flex; gap: 6px; margin-bottom: 10px; }
  .period-btn {
    flex: 1;
    min-height: 40px;
    background: transparent;
    color: var(--text-sec);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .period-btn.active { background: var(--active-bg); color: var(--green); border-color: var(--green); }
  #chartContainer { width: 100%; height: 200px; }
  .chart-placeholder {
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-sec);
    font-size: 13px;
  }

  /* ---------- Cards ---------- */
  .cards-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-sec);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; padding: 4px 0; }
  .card-row .label { color: var(--text-sec); }
  .card-big { font-size: 26px; font-weight: 700; margin-bottom: 6px; }

  /* ---------- Tabs ---------- */
  .tabs-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .tab-btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    padding: 0 4px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-sec);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--green); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ---------- Listas (posiciones / estrategias) ---------- */
  .row-list { display: flex; flex-direction: column; gap: 8px; }
  .pos-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
  }
  .pos-row .pair { font-weight: 700; grid-column: 1 / -1; margin-bottom: 4px; }
  .pos-row .cell-label { font-size: 10px; text-transform: uppercase; color: var(--text-sec); }
  .pos-row .cell-value { font-weight: 600; }

  .strat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .strat-header { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .strat-line { font-size: 13px; color: var(--text-sec); }
  .strat-line .hl { color: var(--text); font-weight: 600; }

  .badge { font-size: 12px; margin-left: 4px; }

  .empty-state { color: var(--text-sec); font-size: 13px; text-align: center; padding: 24px 12px; }

  /* ---------- Análisis ---------- */
  .diary-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .diary-body { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
  .diary-meta { font-size: 12px; color: var(--text-sec); margin-top: 12px; }
  .market-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .market-chip { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .market-chip .sym { font-size: 11px; color: var(--text-sec); }
  .market-chip .val { font-size: 14px; font-weight: 700; margin-top: 2px; }

  /* ---------- Sistema ---------- */
  .sys-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .sys-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .sys-item .val { margin-left: auto; color: var(--text-sec); }
  .subsection-title { font-size: 12px; text-transform: uppercase; color: var(--text-sec); font-weight: 700; margin: 18px 0 8px; }
  .err-item { font-size: 12px; padding: 8px; border-left: 2px solid var(--red); background: var(--card); border-radius: 0 8px 8px 0; margin-bottom: 6px; }

  /* ---------- Skeleton ---------- */
  .skeleton { color: var(--text-sec); }

  /* ---------- Desktop ---------- */
  @media (min-width: 768px) {
    main { padding: 24px; }
    #chartContainer { height: 280px; }
    .chart-placeholder { height: 280px; }
    .cards-row { grid-template-columns: repeat(3, 1fr); }
    .pos-row { grid-template-columns: 1.5fr 1fr 1fr 1fr; align-items: center; }
    .pos-row .pair { grid-column: auto; margin-bottom: 0; }
    .metric-value { font-size: 32px; }
    .tab-btn { font-size: 14px; padding: 0 14px; flex: 1; }
  }
</style>
</head>
<body>

<header class="header" id="header">
  <div class="header-top">
    <span class="brand">⚡ NUVERA BOT</span>
    <span class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">—</span></span>
    <span class="pill" id="modePill">—</span>
  </div>
  <div class="header-main">
    <div>
      <div class="metric-value" id="capitalValue">—</div>
      <div class="metric-label">Capital</div>
    </div>
    <div>
      <div class="metric-value metric-pnl" id="pnlValue">—</div>
      <div class="metric-label">Ganancia hoy</div>
    </div>
  </div>
  <div class="header-sub">
    <span id="fearGreedText">Fear &amp; Greed: —</span>
    <span id="lastUpdateText">Última act: —</span>
  </div>
</header>

<main>

  <section class="chart-card">
    <div class="period-selector" id="periodSelector">
      <button class="period-btn" data-period="1h">1H</button>
      <button class="period-btn" data-period="6h">6H</button>
      <button class="period-btn active" data-period="24h">24H</button>
      <button class="period-btn" data-period="7d">7D</button>
    </div>
    <div id="chartPlaceholder" class="chart-placeholder">Cargando gráfica…</div>
    <div id="chartContainer" style="display:none;"></div>
  </section>

  <section class="cards-row">
    <div class="card">
      <div class="card-title">📈 Hoy</div>
      <div class="card-row"><span class="label">PnL</span><span class="cell-value" id="cardHoyPnl">—</span></div>
      <div class="card-row"><span class="label">Trades</span><span id="cardHoyTrades">—</span></div>
      <div class="card-row"><span class="label">WR / PF</span><span id="cardHoyWrPf">—</span></div>
    </div>
    <div class="card">
      <div class="card-title">💰 Capital</div>
      <div class="card-big" id="cardCapitalTotal">—</div>
      <div class="card-row"><span class="label">En trades</span><span id="cardCapitalEnTrades">—</span></div>
      <div class="card-row"><span class="label">Libre</span><span id="cardCapitalLibre">—</span></div>
    </div>
    <div class="card">
      <div class="card-title">🧠 Inteligencia</div>
      <div class="card-row"><span class="label">Ollama</span><span id="cardIaOllama">—</span></div>
      <div class="card-row"><span class="label">XGBoost</span><span id="cardIaXgb">—</span></div>
      <div class="card-row"><span class="label">Aprend. hoy</span><span id="cardIaLearnings">—</span></div>
    </div>
  </section>

  <section class="tabs-section">
    <div class="tabs-nav" role="tablist">
      <button class="tab-btn active" data-tab="posiciones" role="tab">Posiciones</button>
      <button class="tab-btn" data-tab="estrategias" role="tab">Estrategias</button>
      <button class="tab-btn" data-tab="analisis" role="tab">Análisis</button>
      <button class="tab-btn" data-tab="sistema" role="tab">Sistema</button>
    </div>

    <div class="tab-panel active" id="tab-posiciones">
      <div class="row-list" id="posicionesList"><div class="empty-state skeleton">Cargando…</div></div>
      <div class="empty-state" id="posicionesVerMas" style="display:none;"></div>
    </div>

    <div class="tab-panel" id="tab-estrategias">
      <div id="estrategiasList"><div class="empty-state skeleton">Cargando…</div></div>
    </div>

    <div class="tab-panel" id="tab-analisis">
      <div id="analisisContent"><div class="empty-state skeleton">Cargando…</div></div>
    </div>

    <div class="tab-panel" id="tab-sistema">
      <div id="sistemaContent"><div class="empty-state skeleton">Cargando…</div></div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
